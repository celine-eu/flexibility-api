[project]
name = "celine-flexibility-api"
version = "1.4.2"
description = "CELINE Flexibility API — commitment store for voluntary and automated load-shifting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136.1",
  "uvicorn[standard]>=0.46.0",
  "pydantic>=2.13.3",
  "pydantic-settings>=2.14.0",
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.30.0",
  "alembic>=1.13.0",
  "python-dotenv>=1.0",
  "PyJWT[crypto]>=2.14",
  "httpx>=0.28.0",
  # TODO(posture): celine.sdk.posture (security/posture.py, security/policy.py) is not in
  # a released celine-sdk yet. Raise this floor to the first release that ships it.
  # TODO(platform-admin): security/policy.py imports celine.sdk.auth.realm_roles, first
  # shipped in celine-sdk 2.0.0 (unreleased). Raise to >=2.0.0 and re-lock on release.
  # TODO(audit): main.py, security/auth.py and security/middleware.py import
  # celine.sdk.audit and celine.sdk.posture.docs_urls, not in a released celine-sdk yet.
  # Raise this floor to the first release that ships them.
  # TODO(audit-route): security/middleware.py passes route= to audit_denied, first
  # accepted in celine-sdk after cbc741b (unreleased). Raise the floor on release.
  "celine-sdk>=2.0.0",
]

[tool.uv]

[dependency-groups]
dev = [
  "python-semantic-release>=10.5.3",
  "debugpy>=1.8.20",
  "pytest>=9.0.3",
  "pytest-asyncio>=0.24",
  "aiosqlite>=0.22.1",
]

# The suite reaches no external service: PostgreSQL, the Digital Twin, rec-registry,
# nudging-tool, the MQTT broker and Keycloak's JWKS are all faked. OPA is the exception
# and is deliberately real — see docs/decisions/ADR-0002 and .agents/playbooks/testing.md.
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  # celine-sdk's generated OpenAPI models still use Pydantic v1 config. Ours to
  # neither fix nor read past on every run.
  "ignore::pydantic.PydanticDeprecatedSince20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/celine/flexibility"]
sources = {"src" = ""}

# The Rego bundle travels inside the package, so an installed service (the image)
# finds it next to its code rather than in the working directory (security/policy.py).
[tool.hatch.build.targets.wheel.force-include]
"policies" = "celine/flexibility/policies"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]

build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

branch = "main"
changelog_file = "CHANGELOG.md"
tag_format = "v{version}"
commit_parser = "conventional"

upload_to_release = false
upload_to_pypi = false
commit_version_number = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "up"]
parse_squash_commits = true
ignore_merge_commits = true
