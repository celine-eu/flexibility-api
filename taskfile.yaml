version: "3"

tasks:
  setup:
    desc: Install dependencies
    cmds:
      - uv sync

  run:
    desc: Run development server
    cmds:
      # The prepared virtualenv (`task setup`), not `uv run`: that re-syncs the
      # lockfile and would replace an editable celine-sdk link with the locked wheel.
      - CELINE_ENV=${CELINE_ENV:-dev} .venv/bin/uvicorn celine.flexibility.main:create_app --factory --reload --host 0.0.0.0 --port 8017

  debug:
    desc: Run development server with debugger
    cmds:
      - CELINE_ENV=${CELINE_ENV:-dev} LOG_LEVEL=DEBUG DEBUG_ATTACH=nowait DEBUG_PORT=48017 .venv/bin/uvicorn celine.flexibility.main:create_app --factory --reload --host 0.0.0.0 --port 8017

  test:
    desc: Run tests
    cmds:
      - .venv/bin/pytest {{.CLI_ARGS}}

  alembic:migrate:
    desc: Run migrations (upgrade head)
    cmds:
      - .venv/bin/alembic upgrade head

  alembic:sync-model:
    desc: Autogenerate a new revision
    cmds:
      - .venv/bin/alembic revision --autogenerate -m "{{.MSG}}"
    vars:
      MSG: "update model"

  alembic:check:
    desc: Fail if the models imply a revision that does not exist (needs PostgreSQL)
    cmds:
      - .venv/bin/alembic check

  alembic:reset:
    desc: Downgrade to base (wipe schema)
    cmds:
      - .venv/bin/alembic downgrade base

  release:
    cmds:
      - uv run semantic-release -v version --no-vcs-release
      - git push
      - git push --tags
